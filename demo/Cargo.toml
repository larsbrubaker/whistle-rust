# The whistle-rust demo (browser and desktop): live speech-to-text on the library. Press Record
# and speak, or pick or drop a WAV file. Deployed at https://larsbrubaker.github.io/whistle-rust/.
# Its own Cargo workspace, so the library's workspace, CI test job and package never depend on
# the GUI toolkit.
#
# - whistle-demo        (rlib)   the agg-gui UI and its state, tested natively
# - whistle-demo-web    (cdylib) the UI's wasm on agg-gui-web-shell; empty natively
# - whistle-demo-worker (cdylib) the transcription Web Worker's wasm (simd128); empty natively
# - whistle-demo-native (bin)    the same UI on the desktop (agg-gui-shell), model on a thread
# - web/                         the page (bun + vite); web/build-wasm.sh fills web/pkg/
#
# The library is a path dependency (../crates/whistle-rust). agg-gui, agg-gui-web-shell,
# agg-gui-shell and agg-mic (the desktop build's microphone) come from the sibling agg-gui
# checkout (../../agg-gui from here), which needs the agg-rust and tess2-rust checkouts beside
# it; CI's demo job clones all three.
#
# In the browser the model runs only in the worker, one thread, so the UI never blocks; the
# worker's wasm holds no GUI code (about 450 KB). Build and run, from the repository root (the
# browser build also needs wasm-pack and bun):
#
#   scripts/fetch-weights.sh                                  # models/whistle.cact
#   ln -sf ../../../models/whistle.cact demo/web/public/whistle.cact
#   demo/web/build-wasm.sh                                    # demo/web/pkg/ui and pkg/worker
#   (cd demo/web && bun install && bun run dev)
#   (cd demo && cargo run -p whistle-demo-native --release -- [file.wav] [--help])
#   scripts/demo-gates.sh                                     # the demo's full check
[workspace]
resolver = "2"
members = ["whistle-demo", "whistle-demo-web", "whistle-demo-worker", "whistle-demo-native"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# agg-gui (through agg-rust) needs 1.88.
rust-version = "1.88"
license = "Apache-2.0"
authors = ["Lars Brubaker <larsbrubaker@matterhackers.com>"]
repository = "https://github.com/larsbrubaker/whistle-rust"

[workspace.dependencies]
whistle-rust = { path = "../crates/whistle-rust" }
agg-gui = { path = "../../agg-gui/agg-gui" }
agg-gui-web-shell = { path = "../../agg-gui/agg-gui-web-shell" }
agg-gui-shell = { path = "../../agg-gui/agg-gui-shell" }
agg-mic = { path = "../../agg-gui/agg-mic" }

# Inference and rendering are arithmetic-heavy: unoptimized builds would crawl.
[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2
