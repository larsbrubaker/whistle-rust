# workspace-gates: repo-wide gates that are tests only (file_compliance). The library is empty;
# the gates live in tests/ and read the whole workspace from its root.
[package]
name = "workspace-gates"
description = "Repo-wide gates for whistle-rust (file compliance), tests only"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
path = "src/lib.rs"
