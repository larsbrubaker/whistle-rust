# whistle-rust: the library. Std only, no runtime dependencies; builds for
# wasm32-unknown-unknown. Imported as `whistle`.
[package]
name = "whistle-rust"
description = "Pure Rust port of Whistle, an on-device speech-to-text model (English, German, French, Spanish, Italian, Dutch, Polish)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords = ["speech-recognition", "asr", "speech-to-text", "wasm", "transcription"]
categories = ["multimedia::audio", "science"]
readme = "../../README.md"

[lib]
name = "whistle"
path = "src/lib.rs"

[dependencies]

[dev-dependencies]
# The oracle fixtures' manifest.json files (test support only). MIT OR Apache-2.0.
serde_json = "1"
